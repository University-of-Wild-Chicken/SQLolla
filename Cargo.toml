[workspace]
members = ["crates/sqlolla-core", "crates/sqlolla", "crates/sqlolla-host"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[profile.release]
overflow-checks = true
