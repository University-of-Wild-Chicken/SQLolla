[package]
name = "sqlolla-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sqlolla = { path = "../sqlolla" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header"] }
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
